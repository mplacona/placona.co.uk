<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 78px 84px;
    background: #fffdf9;
    color: #181717;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    border-bottom: 18px solid #b83935;
  }
  .eyebrow {
    color: #b83935; font-size: 24px; font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase;
  }
  h1 {
    margin-top: 34px;
    font-size: 92px; font-weight: 800; line-height: 1.02; letter-spacing: -.045em;
    max-width: 15ch;
  }
  .foot { display: flex; align-items: center; gap: 20px; }
  .foot img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; }
  .name { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
  .url { font-size: 26px; color: #68635d; margin-top: 4px; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">Developer relations · software · independent products</p>
    <h1>Programming, technology and useful side quests.</h1>
  </div>
  <div class="foot">
    <img src="../public/images/marcos_bw_500_optim.jpg" alt="">
    <div>
      <div class="name">Marcos Placona</div>
      <div class="url">placona.co.uk</div>
    </div>
  </div>
</body>
</html>
